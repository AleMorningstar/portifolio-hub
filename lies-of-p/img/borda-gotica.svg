             C218 91 200 91 193 103
             C185 116 194 129 207 128
             C218 127 222 117 217 110" stroke-width="2"/>
    <path d="M393 99
             C414 105 432 116 437 131
             C441 145 432 157 420 155
             C408 153 405 141 412 133
             C418 126 428 129 430 137" stroke-width="2"/>

    <!-- tiny top ornament line -->
    <path d="M548 105 C560 100 573 99 587 103 C600 107 611 109 624 106" stroke-width="1.3"/>
    <path d="M623 106 C631 101 639 101 648 105 C655 108 663 108 671 105" stroke-width="1"/>

    <!-- left lower decorative taper -->
    <path d="M105 438 C98 455 98 478 105 491 C112 504 119 516 117 536
             C114 559 98 580 91 603 C82 631 86 657 98 676
             C108 693 112 715 106 737" stroke-width="1.7"/>
    <path d="M106 738 C101 767 101 807 105 842 C109 884 108 921 105 956
             C102 995 105 1038 105 1080 C105 1122 105 1168 105 1210" stroke-width="1.5"/>

