<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5728"/>
      <stop offset="0.35" stop-color="#c49a58"/>
      <stop offset="0.55" stop-color="#e0bd78"/>
      <stop offset="0.8" stop-color="#9b7137"/>
      <stop offset="1" stop-color="#6b4a22"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="0.45"/>
    </filter>
    <g id="diamond">
      <path d="M0,-12 L6,0 L0,12 L-6,0 Z" fill="none" stroke="url(#gold)" stroke-width="2"/>
      <path d="M0,-7 L3,0 L0,7 L-3,0 Z" fill="url(#gold)" opacity=".65"/>
    </g>
    <g id="smallDiamond">
      <path d="M0,-7 L4,0 L0,7 L-4,0 Z" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    </g>
  </defs>

