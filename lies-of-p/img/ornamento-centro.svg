      <circle cx="535" cy="110" r="8"/>
      <circle cx="1065" cy="110" r="17"/>
      <circle cx="1065" cy="110" r="8"/>
      <path d="M535 89v8 M535 123v8 M514 110h8 M548 110h8 M520 95l6 6 M544 119l6 6 M550 95l-6 6 M526 119l-6 6"/>
      <path d="M1065 89v8 M1065 123v8 M1044 110h8 M1078 110h8 M1050 95l6 6 M1074 119l6 6 M1080 95l-6 6 M1056 119l-6 6"/>
    </g>

    <!-- filigrana central -->
    <g stroke-width="1.5">
