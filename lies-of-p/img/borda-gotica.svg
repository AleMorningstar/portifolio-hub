  </g>

  <!-- Corner and terminal ornaments -->
  <g>
    <use href="#diamond" transform="translate(105 424)"/>
    <use href="#smallDiamond" transform="translate(105 1248)"/>
    <use href="#diamond" transform="translate(907 104)"/>
    <use href="#smallDiamond" transform="translate(973 105)"/>
    <use href="#smallDiamond" transform="translate(103 144)"/>
  </g>

  <!-- Needle-like terminal accents -->
  <g fill="url(#gold)">
    <path d="M105 114 L100 132 L105 151 L110 132 Z"/>
    <path d="M105 1238 L102 1250 L105 1262 L108 1250 Z"/>
    <path d="M1070 103 L1084 101 L1101 103 L1084 105 Z"/>
    <path d="M171 58 L174 42 L177 58 L174 76 Z"/>
  </g>

  <!-- faint distressed duplicate strokes -->
  <g fill="none" stroke="#d1aa68" stroke-width=".55" opacity=".42">
    <path d="M167 67 C145 100 142 129 153 157 C165 186 197 198 229 184 C263 169 280 137 308 119 C354 89 408 89 465 104"/>
    <path d="M96 430 C91 474 108 494 111 519 C114 543 98 567 90 593 C80 622 83 650 96 674"/>
    <path d="M102 750 L102 1218"/>
    <path d="M186 112 C252 93 326 81 402 91 C451 98 494 112 552 104"/>
