             C90 212 88 184 104 169
             C121 153 145 160 151 178
             C157 197 145 216 128 224
             C111 232 99 251 98 276
             C97 310 104 340 101 372
             C99 395 101 412 105 429" stroke-width="2.8"/>

    <path d="M143 155
